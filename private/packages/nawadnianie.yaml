# =============================================================================
#  NAWADNIANIE - Dingtian DTWONDER 8CH (HA MQTT Discovery)
#  7 aktywnych stref (r7 rezerwa) + czasy + harmonogram + sekwencja + STOP
#  + auto-blokada wg prognozy deszczu (Met.no) + per-strefa 'podlewaj mimo deszczu' + bezpiecznik
# =============================================================================
# Mapa (poprawiona): r1 Trawnik taras | r2 Kroplowka ogrodek tyl | r3 Kroplowka rabata taras
#   r4 Ogrodek grzadki | r5 Szklarnia | r6 Linia tuje | r7 REZERWA (wolny) | r8 Rabata przod

input_number:
  nawadnianie_strefa_1_czas:
    name: "Trawnik taras - czas (min)"
    min: 0
    max: 60
    step: 1
    unit_of_measurement: "min"
    icon: mdi:timer-outline
  nawadnianie_strefa_2_czas:
    name: "Kroplówka ogródek tył - czas (min)"
    min: 0
    max: 60
    step: 1
    unit_of_measurement: "min"
    icon: mdi:timer-outline
  nawadnianie_strefa_3_czas:
    name: "Kroplówka rabata taras - czas (min)"
    min: 0
    max: 60
    step: 1
    unit_of_measurement: "min"
    icon: mdi:timer-outline
  nawadnianie_strefa_4_czas:
    name: "Ogródek grządki - czas (min)"
    min: 0
    max: 60
    step: 1
    unit_of_measurement: "min"
    icon: mdi:timer-outline
  nawadnianie_strefa_5_czas:
    name: "Szklarnia - czas (min)"
    min: 0
    max: 60
    step: 1
    unit_of_measurement: "min"
    icon: mdi:timer-outline
  nawadnianie_strefa_6_czas:
    name: "Linia tuje - czas (min)"
    min: 0
    max: 60
    step: 1
    unit_of_measurement: "min"
    icon: mdi:timer-outline
  nawadnianie_strefa_8_czas:
    name: "Rabata przód - czas (min)"
    min: 0
    max: 60
    step: 1
    unit_of_measurement: "min"
    icon: mdi:timer-outline

input_boolean:
  nawadnianie_master:
    name: "Nawadnianie aktywne"
    icon: mdi:water-pump
  nawadnianie_blokada_deszcz:
    name: "Blokada (deszcz)"
    icon: mdi:weather-rainy
  nawadnianie_strefa_1_pomin_deszcz:
    name: "Trawnik taras - podlewaj mimo deszczu"
    icon: mdi:weather-sunny-alert
  nawadnianie_strefa_2_pomin_deszcz:
    name: "Kroplówka ogródek tył - podlewaj mimo deszczu"
    icon: mdi:weather-sunny-alert
  nawadnianie_strefa_3_pomin_deszcz:
    name: "Kroplówka rabata taras - podlewaj mimo deszczu"
    icon: mdi:weather-sunny-alert
  nawadnianie_strefa_4_pomin_deszcz:
    name: "Ogródek grządki - podlewaj mimo deszczu"
    icon: mdi:weather-sunny-alert
  nawadnianie_strefa_5_pomin_deszcz:
    name: "Szklarnia - podlewaj mimo deszczu"
    icon: mdi:weather-sunny-alert
  nawadnianie_strefa_6_pomin_deszcz:
    name: "Linia tuje - podlewaj mimo deszczu"
    icon: mdi:weather-sunny-alert
  nawadnianie_strefa_8_pomin_deszcz:
    name: "Rabata przód - podlewaj mimo deszczu"
    icon: mdi:weather-sunny-alert

input_datetime:
  nawadnianie_godzina_startu:
    name: "Godzina startu"
    has_date: false
    has_time: true
    icon: mdi:clock-start

script:
  nawadnianie_sekwencja:
    alias: "Nawadnianie - pelna sekwencja"
    icon: mdi:play-circle
    mode: restart
    sequence:
      - repeat:
          for_each:
            - { strefa: "switch.strefa_1", czas: "input_number.nawadnianie_strefa_1_czas", pomin: "input_boolean.nawadnianie_strefa_1_pomin_deszcz" }  # Trawnik taras
            - { strefa: "switch.strefa_2", czas: "input_number.nawadnianie_strefa_2_czas", pomin: "input_boolean.nawadnianie_strefa_2_pomin_deszcz" }  # Kroplówka ogródek tył
            - { strefa: "switch.strefa_3", czas: "input_number.nawadnianie_strefa_3_czas", pomin: "input_boolean.nawadnianie_strefa_3_pomin_deszcz" }  # Kroplówka rabata taras
            - { strefa: "switch.strefa_4", czas: "input_number.nawadnianie_strefa_4_czas", pomin: "input_boolean.nawadnianie_strefa_4_pomin_deszcz" }  # Ogródek grządki
            - { strefa: "switch.strefa_5", czas: "input_number.nawadnianie_strefa_5_czas", pomin: "input_boolean.nawadnianie_strefa_5_pomin_deszcz" }  # Szklarnia
            - { strefa: "switch.strefa_6", czas: "input_number.nawadnianie_strefa_6_czas", pomin: "input_boolean.nawadnianie_strefa_6_pomin_deszcz" }  # Linia tuje
            - { strefa: "switch.strefa_8", czas: "input_number.nawadnianie_strefa_8_czas", pomin: "input_boolean.nawadnianie_strefa_8_pomin_deszcz" }  # Rabata przód
          sequence:
            - if:
                - condition: template
                  value_template: >
                    {{ states(repeat.item.czas) | int(0) > 0
                       and (is_state('input_boolean.nawadnianie_blokada_deszcz','off')
                            or is_state(repeat.item.pomin,'on')) }}
              then:
                - service: switch.turn_on
                  target:
                    entity_id: "{{ repeat.item.strefa }}"
                - delay:
                    minutes: "{{ states(repeat.item.czas) | int(0) }}"
                - service: switch.turn_off
                  target:
                    entity_id: "{{ repeat.item.strefa }}"
                - delay: "00:00:03"

  nawadnianie_stop:
    alias: "Nawadnianie - STOP"
    icon: mdi:stop-circle
    sequence:
      - service: script.turn_off
        target:
          entity_id: script.nawadnianie_sekwencja
      - service: switch.turn_off
        target:
          entity_id:
            - switch.strefa_1
            - switch.strefa_2
            - switch.strefa_3
            - switch.strefa_4
            - switch.strefa_5
            - switch.strefa_6
            - switch.strefa_7
            - switch.strefa_8

automation:
  - id: nawadnianie_auto_start
    alias: "Nawadnianie - start o zadanej godzinie"
    trigger:
      - platform: time
        at: input_datetime.nawadnianie_godzina_startu
    condition:
      - condition: state
        entity_id: input_boolean.nawadnianie_master
        state: "on"
    action:
      - service: script.turn_on
        target:
          entity_id: script.nawadnianie_sekwencja

  - id: nawadnianie_offline_alarm
    alias: "Nawadnianie - sterownik offline"
    trigger:
      - platform: state
        entity_id: switch.strefa_1
        to: "unavailable"
        for: "00:02:00"
    action:
      - service: persistent_notification.create
        data:
          title: "Nawadnianie"
          message: "Sterownik Dingtian jest niedostepny (sprawdz WiFi / zasilanie)."

  - id: nawadnianie_rain_check
    alias: "Nawadnianie - blokada wg prognozy deszczu"
    trigger:
      - platform: time
        at: "05:45:00"
      - platform: homeassistant
        event: start
    action:
      - service: weather.get_forecasts
        target:
          entity_id: weather.forecast_dom
        data:
          type: daily
        response_variable: fc
      - variables:
          f0: "{{ (fc['weather.forecast_dom'].forecast | default([]))[0] | default({}) }}"
          rain_mm: "{{ f0.precipitation | float(0) }}"
          cond: "{{ f0.condition | default('unknown') }}"
          will_rain: "{{ rain_mm >= 2 or cond in ['rainy','pouring','lightning-rainy','snowy','snowy-rainy','hail'] }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ will_rain }}"
            sequence:
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.nawadnianie_blokada_deszcz
              - service: persistent_notification.create
                data:
                  notification_id: nawadnianie_rain
                  title: "Nawadnianie - blokada deszczowa"
                  message: "Prognoza: {{ cond }}, opad {{ rain_mm }} mm. Strefy bez wyjatku pominiete."
        default:
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.nawadnianie_blokada_deszcz
          - service: persistent_notification.dismiss
            data:
              notification_id: nawadnianie_rain

  - id: nawadnianie_watchdog
    alias: "Nawadnianie - bezpiecznik (zawor za dlugo otwarty)"
    trigger:
      - platform: state
        entity_id:
          - switch.strefa_1
          - switch.strefa_2
          - switch.strefa_3
          - switch.strefa_4
          - switch.strefa_5
          - switch.strefa_6
          - switch.strefa_7
          - switch.strefa_8
        to: "on"
        for: "01:05:00"
    action:
      - service: switch.turn_off
        target:
          entity_id: "{{ trigger.entity_id }}"
      - service: persistent_notification.create
        data:
          title: "Nawadnianie - bezpiecznik"
          message: "Zawor {{ trigger.entity_id }} byl otwarty ponad 65 min - wymuszono zamkniecie."
