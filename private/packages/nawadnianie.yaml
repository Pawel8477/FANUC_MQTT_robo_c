  nawadnianie_godzina_startu:
    name: "Godzina startu"
    has_date: false
    has_time: true
    icon: mdi:clock-start

# ------------------------------- SKRYPTY -------------------------------------
script:
  # Pełna sekwencja: strefy jedna po drugiej, wg ustawionych czasów
  nawadnianie_sekwencja:
    alias: "Nawadnianie - pełna sekwencja"
    icon: mdi:play-circle
    mode: restart
    sequence:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.nawadnianie_blokada_deszcz
                state: "on"
            sequence:
              - service: persistent_notification.create
                data:
                  title: "Nawadnianie"
                  message: "Pominięto - aktywna blokada (deszcz)."
        default:
          - repeat:
              for_each:
                - { strefa: "switch.strefa_1", czas: "input_number.nawadnianie_strefa_1_czas" }
                - { strefa: "switch.strefa_2", czas: "input_number.nawadnianie_strefa_2_czas" }
                - { strefa: "switch.strefa_3", czas: "input_number.nawadnianie_strefa_3_czas" }
                - { strefa: "switch.strefa_4", czas: "input_number.nawadnianie_strefa_4_czas" }
                - { strefa: "switch.strefa_5", czas: "input_number.nawadnianie_strefa_5_czas" }
                - { strefa: "switch.strefa_6", czas: "input_number.nawadnianie_strefa_6_czas" }
                - { strefa: "switch.strefa_7", czas: "input_number.nawadnianie_strefa_7_czas" }
                - { strefa: "switch.strefa_8", czas: "input_number.nawadnianie_strefa_8_czas" }
              sequence:
                # pomiń strefę gdy czas = 0
                - condition: template
                  value_template: "{{ states(repeat.item.czas) | int(0) > 0 }}"
                - service: switch.turn_on
                  target:
                    entity_id: "{{ repeat.item.strefa }}"
                - delay:
                    minutes: "{{ states(repeat.item.czas) | int(0) }}"
                - service: switch.turn_off
                  target:
                    entity_id: "{{ repeat.item.strefa }}"
                - delay: "00:00:03"   # przerwa między strefami (ochrona pompy/zaworów)

  # Awaryjne wyłączenie wszystkiego
  nawadnianie_stop:
    alias: "Nawadnianie - STOP"
    icon: mdi:stop-circle
    sequence:
      - service: script.turn_off
        target:
          entity_id: script.nawadnianie_sekwencja
      - service: switch.turn_off
        target:
          entity_id:
            - switch.strefa_1
            - switch.strefa_2
            - switch.strefa_3
            - switch.strefa_4
            - switch.strefa_5
            - switch.strefa_6
            - switch.strefa_7
            - switch.strefa_8

# ------------------------------ AUTOMATYZACJE --------------------------------
automation:
  - id: nawadnianie_auto_start
    alias: "Nawadnianie - start o zadanej godzinie"
    trigger:
      - platform: time
        at: input_datetime.nawadnianie_godzina_startu
    condition:
      - condition: state
        entity_id: input_boolean.nawadnianie_master
        state: "on"
      - condition: state
        entity_id: input_boolean.nawadnianie_blokada_deszcz
        state: "off"
    action:
      - service: script.turn_on
        target:
          entity_id: script.nawadnianie_sekwencja

  # Bezpiecznik: jeśli płytka offline (LWT), powiadom
  - id: nawadnianie_offline_alarm
    alias: "Nawadnianie - sterownik offline"
    trigger:
      - platform: state
        entity_id: switch.strefa_1
        to: "unavailable"
        for: "00:02:00"
    action:
      - service: persistent_notification.create
        data:
          title: "Nawadnianie"
          message: "Sterownik Dingtian jest niedostępny (sprawdź WiFi / zasilanie)."
