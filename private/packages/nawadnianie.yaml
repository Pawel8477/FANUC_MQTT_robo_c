# =============================================================================
#  NAWADNIANIE - Dingtian DTWONDER 8CH (MQTT przez WiFi)
#  Home Assistant package: 8 stref + czasy + harmonogram + sekwencja
# =============================================================================
#  Założenia:
#   - Płytka steruje 8 zaworami elektromagnetycznymi (solenoid NC).
#     Przekaźnik ON  = zawór otwarty = woda leci.
#   - Łączymy po WiFi (tryb STA - patrz README), broker MQTT w Home Assistant.
#   - Strefy podlewane SEKWENCYJNIE (jedna po drugiej), żeby starczyło ciśnienia.
#
#  Topici MQTT (dopasuj w panelu płytki albo tutaj):
#     komenda ->  dingtian/relay01/relay/r{N}/set     payload: ON / OFF
#     stan    ->  dingtian/relay01/relay/r{N}         payload: ON / OFF
#     LWT     ->  dingtian/relay01/availability       online / offline
#  Podgląd realnego ruchu:  mosquitto_sub -h <broker> -t '#' -v
# =============================================================================

# Przelaczniki stref pochodza z HA MQTT Discovery plytki Dingtian (przycisk 'HA Discover').
# Encje switch.strefa_N = przemianowane switch.dingtian_relayXXXXX_rN (rename w rejestrze encji).
# Dlatego pakiet NIE definiuje recznych mqtt: switch — plytka sama je publikuje.
#
# MAPA STREF (fizyczne podlaczenie szafki, 7 zaworow):
#   r1 = switch.strefa_1  -> Trawnik taras
#   r2 = switch.strefa_2  -> Kroplowka ogrodek tyl
#   r3 = switch.strefa_3  -> Kroplowka rabata taras
#   r4 = switch.strefa_4  -> Ogrodek grzadki
#   r5 = switch.strefa_5  -> Szklarnia
#   r6 = switch.strefa_6  -> WOLNY (zapas) - poza logika nawadniania
#   r7 = switch.strefa_7  -> Linia tuje
#   r8 = switch.strefa_8  -> Rabata przod

input_number:
  nawadnianie_strefa_1_czas:
    name: "Trawnik taras - czas (min)"
    min: 0
    max: 60
    step: 1
    unit_of_measurement: "min"
    icon: mdi:timer-outline
  nawadnianie_strefa_2_czas:
    name: "Kroplowka ogrodek tyl - czas (min)"
    min: 0
    max: 60
    step: 1
    unit_of_measurement: "min"
    icon: mdi:timer-outline
  nawadnianie_strefa_3_czas:
    name: "Kroplowka rabata taras - czas (min)"
    min: 0
    max: 60
    step: 1
    unit_of_measurement: "min"
    icon: mdi:timer-outline
  nawadnianie_strefa_4_czas:
    name: "Ogrodek grzadki - czas (min)"
    min: 0
    max: 60
    step: 1
    unit_of_measurement: "min"
    icon: mdi:timer-outline
  nawadnianie_strefa_5_czas:
    name: "Szklarnia - czas (min)"
    min: 0
    max: 60
    step: 1
    unit_of_measurement: "min"
    icon: mdi:timer-outline
  nawadnianie_strefa_7_czas:
    name: "Linia tuje - czas (min)"
    min: 0
    max: 60
    step: 1
    unit_of_measurement: "min"
    icon: mdi:timer-outline
  nawadnianie_strefa_8_czas:
    name: "Rabata przod - czas (min)"
    min: 0
    max: 60
    step: 1
    unit_of_measurement: "min"
    icon: mdi:timer-outline

# Uwaga: r6 (switch.strefa_6) jest WOLNY (zapas) i NIE ma wpisu tutaj ani w sekwencji.

input_boolean:
  nawadnianie_master:
    name: "Nawadnianie aktywne"
    icon: mdi:water-pump
  nawadnianie_blokada_deszcz:
    name: "Blokada (deszcz)"
    icon: mdi:weather-rainy

input_datetime:
  nawadnianie_godzina_startu:
    name: "Godzina startu"
    has_date: false
    has_time: true
    icon: mdi:clock-start

# ------------------------------- SKRYPTY -------------------------------------
script:
  # Pełna sekwencja: strefy jedna po drugiej, wg ustawionych czasów
  nawadnianie_sekwencja:
    alias: "Nawadnianie - pełna sekwencja"
    icon: mdi:play-circle
    mode: restart
    sequence:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.nawadnianie_blokada_deszcz
                state: "on"
            sequence:
              - service: persistent_notification.create
                data:
                  title: "Nawadnianie"
                  message: "Pominięto - aktywna blokada (deszcz)."
        default:
          - repeat:
              for_each:
                - { strefa: "switch.strefa_1", czas: "input_number.nawadnianie_strefa_1_czas" }  # Trawnik taras
                - { strefa: "switch.strefa_2", czas: "input_number.nawadnianie_strefa_2_czas" }  # Kroplowka ogrodek tyl
                - { strefa: "switch.strefa_3", czas: "input_number.nawadnianie_strefa_3_czas" }  # Kroplowka rabata taras
                - { strefa: "switch.strefa_4", czas: "input_number.nawadnianie_strefa_4_czas" }  # Ogrodek grzadki
                - { strefa: "switch.strefa_5", czas: "input_number.nawadnianie_strefa_5_czas" }  # Szklarnia
                - { strefa: "switch.strefa_7", czas: "input_number.nawadnianie_strefa_7_czas" }  # Linia tuje
                - { strefa: "switch.strefa_8", czas: "input_number.nawadnianie_strefa_8_czas" }  # Rabata przod
              sequence:
                # pomiń strefę gdy czas = 0
                - condition: template
                  value_template: "{{ states(repeat.item.czas) | int(0) > 0 }}"
                - service: switch.turn_on
                  target:
                    entity_id: "{{ repeat.item.strefa }}"
                - delay:
                    minutes: "{{ states(repeat.item.czas) | int(0) }}"
                - service: switch.turn_off
                  target:
                    entity_id: "{{ repeat.item.strefa }}"
                - delay: "00:00:03"   # przerwa między strefami (ochrona pompy/zaworów)

  # Awaryjne wyłączenie wszystkiego
  nawadnianie_stop:
    alias: "Nawadnianie - STOP"
    icon: mdi:stop-circle
    sequence:
      - service: script.turn_off
        target:
          entity_id: script.nawadnianie_sekwencja
      - service: switch.turn_off
        target:
          entity_id:
            - switch.strefa_1
            - switch.strefa_2
            - switch.strefa_3
            - switch.strefa_4
            - switch.strefa_5
            - switch.strefa_7
            - switch.strefa_8

# ------------------------------ AUTOMATYZACJE --------------------------------
automation:
  - id: nawadnianie_auto_start
    alias: "Nawadnianie - start o zadanej godzinie"
    trigger:
      - platform: time
        at: input_datetime.nawadnianie_godzina_startu
    condition:
      - condition: state
        entity_id: input_boolean.nawadnianie_master
        state: "on"
      - condition: state
        entity_id: input_boolean.nawadnianie_blokada_deszcz
        state: "off"
    action:
      - service: script.turn_on
        target:
          entity_id: script.nawadnianie_sekwencja

  # Bezpiecznik: jeśli płytka offline (LWT), powiadom
  - id: nawadnianie_offline_alarm
    alias: "Nawadnianie - sterownik offline"
    trigger:
      - platform: state
        entity_id: switch.strefa_1
        to: "unavailable"
        for: "00:02:00"
    action:
      - service: persistent_notification.create
        data:
          title: "Nawadnianie"
          message: "Sterownik Dingtian jest niedostępny (sprawdź WiFi / zasilanie)."

  # Auto-blokada wg prognozy deszczu (Met.no)
  - id: nawadnianie_rain_check
    alias: "Nawadnianie - blokada wg prognozy deszczu"
    trigger:
      - platform: time
        at: "05:45:00"
      - platform: homeassistant
        event: start
    action:
      - service: weather.get_forecasts
        target:
          entity_id: weather.forecast_dom
        data:
          type: daily
        response_variable: fc
      - variables:
          f0: "{{ (fc['weather.forecast_dom'].forecast | default([]))[0] | default({}) }}"
          rain_mm: "{{ f0.precipitation | float(0) }}"
          cond: "{{ f0.condition | default('unknown') }}"
          will_rain: "{{ rain_mm >= 2 or cond in ['rainy','pouring','lightning-rainy','snowy','snowy-rainy','hail'] }}"
      - choose:
          - conditions:
              - condition: template
                value_template: "{{ will_rain }}"
            sequence:
              - service: input_boolean.turn_on
                target:
                  entity_id: input_boolean.nawadnianie_blokada_deszcz
              - service: persistent_notification.create
                data:
                  notification_id: nawadnianie_rain
                  title: "Nawadnianie - blokada deszczowa"
                  message: "Prognoza: {{ cond }}, opad {{ rain_mm }} mm. Podlewanie dzis pominiete."
        default:
          - service: input_boolean.turn_off
            target:
              entity_id: input_boolean.nawadnianie_blokada_deszcz
          - service: persistent_notification.dismiss
            data:
              notification_id: nawadnianie_rain
